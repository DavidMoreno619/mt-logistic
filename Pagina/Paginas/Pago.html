<section class="payment-form-page">

    <div class="page-header">

        <div>

            <h1>Registrar pago</h1>

            <p>
                Registra un pago realizado por el cliente
            </p>

        </div>

    </div>


    <form
        id="paymentForm"
        class="form-card"
    >

        <h2>Información de la factura</h2>


        <div class="form-grid">

            <div class="form-group">

                <label>
                    Factura
                </label>

                <input
                    type="text"
                    value="FAC-004"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Cliente
                </label>

                <input
                    type="text"
                    value="Transportes del Norte"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Total de factura
                </label>

                <input
                    type="text"
                    value="$20,000.00"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Saldo pendiente
                </label>

                <input
                    type="text"
                    value="$12,000.00"
                    readonly
                >

            </div>

        </div>


        <h2 class="form-section-title">
            Nuevo pago
        </h2>


        <div class="form-grid">

            <div class="form-group">

                <label for="paymentAmount">
                    Monto del pago
                </label>

                <input
                    type="number"
                    id="paymentAmount"
                    min="0.01"
                    step="0.01"
                    placeholder="0.00"
                    required
                >

            </div>


            <div class="form-group">

                <label for="paymentDate">
                    Fecha del pago
                </label>

                <input
                    type="date"
                    id="paymentDate"
                    required
                >

            </div>


            <div class="form-group">

                <label for="paymentMethod">
                    Método de pago
                </label>

                <select
                    id="paymentMethod"
                    required
                >

                    <option value="">
                        Seleccionar
                    </option>

                    <option value="Transferencia">
                        Transferencia
                    </option>

                    <option value="Efectivo">
                        Efectivo
                    </option>

                    <option value="Cheque">
                        Cheque
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="paymentReference">
                    Referencia
                </label>

                <input
                    type="text"
                    id="paymentReference"
                    placeholder="Número de referencia"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="paymentNotes">
                Observaciones
            </label>

            <textarea
                id="paymentNotes"
                rows="4"
                placeholder="Observaciones del pago..."
            ></textarea>

        </div>


        <div class="form-actions">

            <button
                type="button"
                class="secondary-button"
                id="cancelPayment"
            >
                Cancelar
            </button>

            <button
                type="submit"
                class="primary-button"
            >
                Registrar pago
            </button>

        </div>

    </form>

</section>
