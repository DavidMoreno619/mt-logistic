<section class="trucks-page">

    <div class="page-header">
        <div>
            <h1>Camiones</h1>
            <p>Administración de las unidades de MT</p>
        </div>

        <button
            type="button"
            class="primary-button"
            id="newTruckButton">
            + Agregar camión
        </button>
    </div>

    <div class="filters-panel">
        <input
            type="text"
            id="truckSearch"
            placeholder="Buscar por número, placas o modelo...">

        <select id="truckStatusFilter">
            <option value="">Todos los estados</option>
            <option value="Disponible">Disponible</option>
            <option value="En ruta">En ruta</option>
            <option value="Mantenimiento">Mantenimiento</option>
        </select>
    </div>

    <div class="table-panel">
        <table class="trucks-table">
            <thead>
                <tr>
                    <th>Unidad</th>
                    <th>Placas</th>
                    <th>Modelo</th>
                    <th>Capacidad</th>
                    <th>Operador</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <!-- JavaScript generará las filas -->
            <tbody id="trucksTableBody"></tbody>
        </table>
    </div>

</section>
